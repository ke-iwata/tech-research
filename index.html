<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tech-radar</title>
<meta name="description" content="技術と金融・投資の情報を毎日集めて可視化する、自分用のダッシュボード">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0E14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=20261004">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#today" aria-label="tech-radar トップ"><span class="brand-mark" aria-hidden="true">&gt;_</span><span class="brand-name">tech-radar</span></a>
  <nav class="tabs" aria-label="画面">
    <a href="#today" data-view="today">today.md</a>
    <a href="#reader" data-view="reader">reader/</a>
    <a href="#radar" data-view="radar">radar.svg</a>
    <a href="#market" data-view="market">market.map</a>
  </nav>
  <div class="seg" id="domain" role="group" aria-label="領域で絞り込み">
    <button type="button" data-domain="all">all</button>
    <button type="button" data-domain="tech">tech</button>
    <button type="button" data-domain="money">money</button>
  </div>
  <label class="search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <span class="sr-only">記事を検索</span>
    <input type="search" id="q" placeholder="grep articles…" autocomplete="off">
    <kbd>/</kbd>
  </label>
  <label class="datepick">
    <span class="sr-only">日付</span>
    <select id="date"></select>
  </label>
</header>

<main id="app">
  <section class="view" id="view-today" aria-label="今日のブリーフ"></section>
  <section class="view" id="view-reader" aria-label="リーダー"></section>
  <section class="view" id="view-radar" aria-label="キーワード・レーダー"></section>
  <section class="view" id="view-market" aria-label="マーケットマップ"></section>
</main>

<footer class="statusbar" id="statusbar"></footer>
<script src="assets/app.js?v=20261004"></script>
</body>
</html>
